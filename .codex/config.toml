# FILE: .codex/config.toml
# NOTE: Network + web search are enabled so Codex can read required external docs
# referenced by title in ExecPlans. Keep external URLs out of repo markdown; provide them
# in the initiation prompt instead.
#
# Active runbook: see `ExecPlans.md`.

model = "gpt-5.2-codex"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[features]
network_access = true
web_search_request = true
