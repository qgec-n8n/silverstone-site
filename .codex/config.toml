# FILE: .codex/config.toml
#
# Codex configuration for working on the Silverstone repo.
#
# This file is intended for use with the Codex CLI and related tools. Codex
# Cloud environments may manage some of these settings separately, but keeping
# them here makes local behaviour predictable.
#
# Focus:
# - Use a coding‑optimised model.
# - Allow writes within the workspace.
# - Give Codex consistent access to project docs (AGENTS, PLANS, ExecPlans, Output_1/2).
# - Encourage deeper reasoning for non‑trivial refactors.

model = "gpt-5-codex-mx"

# Allow Codex to read/write within the workspace (but not outside).
sandbox_mode = "workspace-write"

# Encourage more thorough reasoning when supported.
model_reasoning_effort = "xhigh"

# Project documents Codex should preferentially load as context when working in
# this repository. These paths are relative to the repo root.
project_docs = [
  "AGENTS.md",
  ".agent/PLANS.md",
  ".agent/ExecPlan.SilverstoneFrontend.md",
  ".agent/ExecPlan.FinalDecomposition.md",
  "Output_1.md",
  "Output_2.md"
]

# Increase limit so AGENTS + PLANS + ExecPlans + Output docs all fit.
project_doc_max_bytes = 65536

# Prefer hiding internal reasoning in CLI UIs by default; summaries will be
# exposed via normal responses.
hide_agent_reasoning = true

[tools]
# Web search is not required for this static‑site refactor when running the
# Codex CLI locally. Keep it off by default; Codex Cloud can still use web
# access according to its own environment settings.
web_search = false
