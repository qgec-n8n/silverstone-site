# FILE: .codex/config.toml
model = "gpt-5.1-codex-max"
model_reasoning_effort = "high"
model_verbosity = "medium"

# Keep execution non-interactive in the standard Codex CLI loop.
approval_policy = "never"

# Shell commands should not mutate the system; file edits happen via Codex itself.
sandbox_mode = "read-only"

# Provide Codex the minimum, high-signal control context for this request.
include = [
  "ExecPlans.md",
  "ExecPlan_UI_Fixes.md",
  "PLANS.md",
  "AGENTS.md",
  "codex/CODEX_SYSTEM_PROMPT.md",
  "codex/REQUESTED_EDITS_SPEC.md",
  "codex/MANUAL_QA_CHECKLIST.md",
  "codex/UI_CHANGE_LOG.md",
  "scripts/codex.requested-edits.sh",
]

# The canonical verification entrypoint for this repo.
command = "bash scripts/codex.requested-edits.sh"
