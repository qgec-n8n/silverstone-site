# FILE: .codex/config.toml

# Repo-suggested Codex config.
# Copy/merge into your ~/.codex/config.toml as needed.

# Default model profile (constraint: only GPT-5.2 or GPT-5.1 Codex Max)
model = "gpt-5.2"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "workspace-write"

[features]
web_search_request = true
ghost_commit = true

[profiles.gpt52_high]
model = "gpt-5.2"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "workspace-write"

[profiles.gpt51_codex_max_high]
model = "gpt-5.1-codex-max"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "workspace-write"
