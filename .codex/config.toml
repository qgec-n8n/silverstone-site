# FILE: .codex/config.toml

# Codex project configuration for the Silverstone static site.
# Tuned for high-reliability UI work with strict scope control.

model = "gpt-5.1-codex-max"
model_reasoning_effort = "high"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Ensure AGENTS.md + ExecPlan.md + PLANS.md fit into injected project docs.
# Default is 32 KiB; raise for this repo.
project_doc_max_bytes = 65536

[features]
web_search_request = true

[sandbox_workspace_write]
# Keep outbound network disabled unless explicitly needed.
network_access = false

[tui]
hide_agent_reasoning = true

[profiles.readonly_quick]
model = "gpt-5.1-codex-max"
model_reasoning_effort = "medium"
approval_policy = "untrusted"
sandbox_mode = "read-only"

[profiles.high_effort_ui]
model = "gpt-5.1-codex-max"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
