# FILE: .codex/config.toml
# Baseline Codex CLI project config.
# Note: Codex CLI primarily reads user config from ~/.codex/config.toml; this repo file
# is kept as a shared baseline for consistent runs.

model = "gpt-5.1-codex-max"
model_reasoning_effort = "high"

# Ask for approval only when something fails or is risky; keep edits incremental.
approval_policy = "on-failure"

# Allow writing within the repo workspace.
sandbox_mode = "workspace-write"

# Allow larger local docs (pricing copy map + steering specs).
project_doc_max_bytes = 200000

# Allow the agent to request web searches when needed.
web_search_request = true

[features]
# Create incremental ghost commits during the run (useful for step-by-step review).
ghost_commit = true
