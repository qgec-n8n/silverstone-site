# FILE: .codex/config.toml
# Repo-scoped Codex configuration.
#
# This repo uses scripts/codex.run.sh to set CODEX_HOME to this folder.
# Web search + network access are enabled to support debugging and behavior verification.
# All code changes must remain grounded in this repository.

model = "gpt-5.2-codex"
review_model = "gpt-5.2-codex"
model_reasoning_effort = "high"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[features]
web_search_request = true

[sandbox_workspace_write]
network_access = true
