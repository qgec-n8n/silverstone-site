# FILE: .codex/config.toml

# Codex project configuration for the Silverstone static site.
# Notes:
# - This config prioritizes the planning docs used for the current workstream.
# - Web search is disabled by default because this task is repo-contained.

model = "gpt-5.1-codex-max"
sandbox_mode = "workspace-write"
model_reasoning_effort = "medium"
hide_agent_reasoning = true

project_doc_max_bytes = 120000

project_docs = [
  "AGENTS.md",
  ".agent/PLANS.md",

  ".agent/NICHE_TEMPLATES_INDEX.md",
  ".agent/NICHE_PAGES_GUIDE.md",
  ".agent/ICON_CATALOG.md",

  ".agent/ExecPlan.Niches.Batch.md",
  ".agent/ExecPlan.Niche.Hospitality.md",
  ".agent/ExecPlan.Niche.SalonsBarbers.md",
  ".agent/ExecPlan.Niche.TradesVirtualOffice.md",
  ".agent/ExecPlan.Niche.Ecommerce.md",
  ".agent/ExecPlan.Niche.PhysiosChiropractors.md",
  ".agent/ExecPlan.Niche.Dentists.md",
  ".agent/ExecPlan.Niche.GymsFitnessStudios.md",
  ".agent/ExecPlan.Niche.FitnessCoaches.md"
]

[tools]
web_search = false
