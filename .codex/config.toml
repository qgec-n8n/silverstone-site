# FILE: .codex/config.toml
# Project-local Codex configuration.
# NOTE: This file intentionally contains no external URLs. See the Initiation Prompt in the chat for doc links.

# Use the Codex-tuned GPT-5.2 model for code navigation, refactors, and safe edits.
model = "gpt-5.2-codex"

# Require explicit approval for changes unless the user/agent chooses otherwise.
approval_policy = "on-request"

# Allow writing to the workspace, and allow outbound network so web_search_request can work.
sandbox_mode = "workspace-write"

[features]
# Enables Codex web search requests (needed to read online docs referenced in the Initiation Prompt).
web_search = true

[sandbox_workspace_write]
# Allow network access in workspace-write sandbox mode.
network_access = true

[history]
# Keep a local audit trail in CODEX_HOME for reproducibility.
persistence = "save-all"
max_bytes = 5242880

# Optional: pre-trust this repo (recommended to avoid repeated prompts).
# Add your machine's absolute path to this repo and set trust_level = "trusted".
#
# Example:
# [projects."/ABSOLUTE/PATH/TO/silverstone-site-main"]
# trust_level = "trusted"
