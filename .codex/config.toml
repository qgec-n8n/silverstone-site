# FILE: .codex/config.toml
[project]
name = "silverstone-site-main"
description = "Static site — Requested Edits 1–6 (shader colors, hero legibility, subtitle grey, image fit)."

[model]
model = "gpt-5.2-codex"
temperature = 0.2

[execution]
# Single source-of-truth command Codex must keep green.
command = "bash scripts/codex.requested-edits.sh"

# IMPORTANT: allow Codex to use the internet during execution.
network_access = true
web_search_request = true

[files]
# Keep context tight to reduce scope drift and false coupling.
include = [
  "ExecPlan.md",
  "ExecPlans.md",
  "PLANS.md",
  "AGENTS.md",
  "codex/**/*.md",

  "scripts/**/*.sh",
  "scripts/**/*.js",

  "src/css/**/*.css",
  "src/js/**/*.js",

  "index.html",
  "about.html",
  "services.html",
  "book.html",
  "contact.html",
  "niches/**/*.html",

  "assets/css/**/*.css",
  "assets/js/**/*.js"
]

exclude = [
  "node_modules/**",
  "dist/**",
  ".git/**",
  ".agent/**",

  # Out of scope for Requested Edits 1–6; reduces noise and prevents accidental edits.
  "pricing-widget/**",
  "niche_copy_templates/**",
  "PRICING_COPY_MAP.md"
]
