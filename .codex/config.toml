# FILE: .codex/config.toml

# Project-local Codex configuration for the Silverstone static site.
# Note: Codex CLI primarily reads ~/.codex/config.toml, but keeping this file
# in-repo provides a consistent, shareable baseline.

# Prefer a profile by default (Codex CLI supports `profile = "name"`).
profile = "high_effort_ui"

model = "gpt-5.1-codex-max"
model_reasoning_effort = "high"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Ensure AGENTS.md + ExecPlan.md + PLANS.md fit into injected project docs.
project_doc_max_bytes = 65536

[features]
web_search_request = true

[sandbox_workspace_write]
network_access = false

[tui]
hide_agent_reasoning = true

[profiles.readonly_quick]
model = "gpt-5.1-codex-max"
model_reasoning_effort = "medium"
approval_policy = "untrusted"
sandbox_mode = "read-only"

[profiles.high_effort_ui]
model = "gpt-5.1-codex-max"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
