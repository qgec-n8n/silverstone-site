# FILE: .codex/config.toml
# This is a sample Codex CLI config. Place in ~/.codex/config.toml or merge into your existing config.
# It is included in-repo so agents and humans have a shared baseline.

# Default to GPT-5.2 for strong reasoning + robustness.
model = "gpt-5.2"
model_reasoning_effort = "high"

# Ask for approvals on potentially destructive actions only.
approval_policy = "on-failure"

# Allow writing within the repo workspace.
sandbox_mode = "workspace-write"

[features]
web_search_request = true
ghost_commit = true

# Optional profiles for task-specific runs.
[profiles.site-ui-fixes]
model = "gpt-5.1-codex-max"
model_reasoning_effort = "high"
approval_policy = "on-failure"
sandbox_mode = "workspace-write"

[profiles.pricing-tuning]
model = "gpt-5.2"
model_reasoning_effort = "high"
approval_policy = "on-failure"
sandbox_mode = "workspace-write"
