# Global defaults
model = "gpt-5.1-codex-max"
model_reasoning_effort = "xhigh"

# Make sure project docs are easy to discover
project_doc_fallback_filenames = ["AGENTS.md", "PLANS.md"]

[features]
# Allow the model to request web search when needed (if you want web access)
web_search_request = true

[tools]
# Enable web search and keep it limited to documentation lookups
web_search = true
view_image = true
