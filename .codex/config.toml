# FILE: .codex/config.toml

# Project-local Codex configuration for the Silverstone static site.
# Goal: bias towards surgical edits, strict gate-by-gate execution, and low regression risk.

profile = "pricing_surgical"

model = "gpt-5.1-codex-max"
model_reasoning_effort = "high"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

project_doc_max_bytes = 65536

[features]
web_search_request = true

[sandbox_workspace_write]
network_access = false

[tui]
hide_agent_reasoning = true

# Profiles
[profiles.pricing_surgical]
model = "gpt-5.1-codex-max"
model_reasoning_effort = "high"
approval_policy = "on-request"
