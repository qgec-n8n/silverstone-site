# FILE: .codex/config.toml
#
# Codex configuration for working on the Silverstone repo.
#
# This file is intended for use with Codex CLI and related tools. It may also
# be used as CODEX_HOME in automation contexts (e.g. CI) if desired.
#
# The configuration focuses on:
# - Using a coding-optimized model (GPT-5 Codex family).
# - Keeping filesystem access scoped to the workspace.
# - Ensuring project docs (AGENTS, PLANS, Output_1/2) are treated as guidance.
#
# NOTE: Codex Cloud environments manage many of these settings separately;
# this config is primarily useful when using the Codex CLI locally.

model = "gpt-5-codex"
model_provider = "openai"
model_context_window = 32768

# Allow Codex to reason more deeply about multi-file refactors.
model_reasoning_effort = "high"

# Filesystem sandbox:
# - "workspace-write" allows edits inside the workspace while protecting
#   the rest of the system.
sandbox_mode = "workspace-write"

# Approval policy:
# - "on-failure" lets most safe commands run, but escalates when they fail
#   under sandboxing. This reduces unnecessary prompts while preserving safety.
approval_policy = "on-failure"

# Project docs: ensure Codex sees AGENTS/PLANS/Output_1/Output_2 as guidance.
project_doc_fallback_filenames = [
  "PLANS.md",
  ".agent/PLANS.md",
  "Output_1.md",
  "Output_2.md"
]

# Increase limit so AGENTS + PLANS + ExecPlans + Output docs all fit.
project_doc_max_bytes = 65536

# Prefer hiding internal reasoning in CLI UIs by default; summaries will be
# exposed via normal responses.
hide_agent_reasoning = true

[tools]
# Web search is not required for this static-site refactor and is often
# disabled in Codex Cloud environments. Keep it off by default for CLI.
web_search = false
