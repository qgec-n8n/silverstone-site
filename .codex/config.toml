# .codex/config.toml

# Model
model = "gpt-5.2-codex"

# Safety / execution defaults
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[features]
web_search_request = true

[sandbox_workspace_write]
network_access = true

[execution]
# Single source-of-truth command Codex must keep green.
command = "bash scripts/codex.requested-edits.sh"

[files]
# Keep context focused on files relevant to Requested Edits 1–7 and their verification tooling.
include = [
  # Planning + governance
  "ExecPlan.md",
  "ExecPlans.md",
  "PLANS.md",
  "AGENTS.md",
  "codex/**/*.md",

  # Validation tooling
  "scripts/**/*.sh",
  "scripts/**/*.js",
  "build-css.js",
  "package.json",
  "package-lock.json",

  # Source code (edit these; then rebuild bundles)
  "src/css/**/*.css",
  "src/js/**/*.js",

  # Built bundles (must be updated by build scripts)
  "assets/css/styles.css",
  "assets/js/app.js",

  # Pages in scope
  "*.html",
  "niches/**/*.html"
]

exclude = [
  "node_modules/**",
  "dist/**",
  ".git/**",
  ".npm-cache/**",

  # Out of scope for Requested Edits 1–7
  "pricing-widget/**"
