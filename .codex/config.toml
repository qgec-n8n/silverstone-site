# FILE: .codex/config.toml
# This is a sample Codex CLI config. Place in ~/.codex/config.toml or merge into your existing config.
# It is included in-repo so agents and humans have a shared baseline.

# Lock to a capable reasoning model. Do not downgrade.
model = "gpt-5.2"
model_reasoning_effort = "high"

# Ask for approvals on potentially destructive actions only.
# For this repo, we want to allow incremental edits but avoid surprise refactors.
approval_policy = "on-failure"

# Allow writing within the repo workspace.
sandbox_mode = "workspace-write"

[features]
# Allow the agent to request web searches when needed.
web_search_request = true

# Let Codex create a ghost commit after each successful tool run.
# This helps recover from accidental diffs.
ghost_commit = true
