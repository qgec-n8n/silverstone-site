model = "gpt-5.5"
model_reasoning_effort = "xhigh"
personality = "pragmatic"

[projects."/Users/quentingeczy/Desktop/DC-Performance-Coaching"]
trust_level = "trusted"

[projects."/Users/quentingeczy/Desktop/silverstone-site"]
trust_level = "trusted"

[features]
unified_exec = true

# --- MCP servers — kept in sync with .mcp.json by .agents/sync-skills.mjs ---
# Run `node .agents/sync-skills.mjs` after editing .mcp.json.

[mcp_servers.aceternityui]
command = "npx"
args = ["-y", "aceternityui-mcp@1.0.2"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 180
default_tools_approval_mode = "prompt"

[mcp_servers.magic_21st]
command = "/bin/zsh"
args = ["/Users/quentingeczy/Desktop/silverstone-site/.codex/bin/21st-magic-mcp.sh"]
cwd = "/Users/quentingeczy/Desktop/silverstone-site"
env_vars = ["API_KEY_21ST"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 180
default_tools_approval_mode = "prompt"

[mcp_servers.magicui]
command = "npx"
args = ["-y", "@magicuidesign/mcp@2.0.0"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 180
default_tools_approval_mode = "prompt"

[mcp_servers.shadcn]
command = "npx"
args = ["-y", "shadcn@4.11.0", "mcp"]
cwd = "/Users/quentingeczy/Desktop/silverstone-site/web"
