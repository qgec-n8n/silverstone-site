# FILE: .codex/config.toml
# Project-local Codex CLI configuration
# NOTE: Keep this file in-repo so Codex always loads the same guardrails.

model = "gpt-5.2-codex"
reasoning_effort = "high"
approval_policy = "never"

# We need to run build scripts that write to the workspace (assets bundles).
sandbox_mode = "workspace-write"

# Main verification command Codex must run frequently (and must be green at the end).
command = "bash scripts/codex.requested-edits.sh"

# Files Codex should always load as control context.
include = [
  "ExecPlans.md",
  "ExecPlan.md",
  "PLANS.md",
  "AGENTS.md",

  "codex/REQUESTED_EDITS_SPEC.md",
  "codex/REPO_UI_MAP.md",
  "codex/MANUAL_QA_CHECKLIST.md",
  "codex/UI_CHANGE_LOG.md",

  "codex/CODEX_SYSTEM_PROMPT.md",
  "codex/CODEX_INIT_PROMPT.md",
]

[features]
# Allow the model to request web searches when needed.
web_search_request = true

[sandbox_workspace_write]
# Allow network access inside the sandbox so requested web-search / external checks are possible.
network_access = true
