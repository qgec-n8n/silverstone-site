model = "gpt-5.5"
model_reasoning_effort = "high"
personality = "pragmatic"

[features]
unified_exec = true

# --- MCP servers -- generated from .mcp.json by .agents/sync-skills.mjs ---
# Edit .mcp.json, then run `node .agents/sync-skills.mjs`.

[mcp_servers.aceternityui]
command = "npx"
args = ["-y", "aceternityui-mcp@1.0.2"]
enabled = false
startup_timeout_sec = 60
tool_timeout_sec = 180
default_tools_approval_mode = "prompt"

[mcp_servers.gpt-image-2]
command = "/bin/zsh"
args = ["-lc", "exec ./.codex/bin/gpt-image-2-mcp.sh"]
enabled = false
startup_timeout_sec = 60
tool_timeout_sec = 180
default_tools_approval_mode = "prompt"

[mcp_servers.magic_21st]
command = "/bin/zsh"
args = ["-lc", "exec ./.codex/bin/21st-magic-mcp.sh"]
env_vars = ["API_KEY_21ST"]
enabled = false
startup_timeout_sec = 60
tool_timeout_sec = 180
default_tools_approval_mode = "prompt"

[mcp_servers.magicui]
command = "npx"
args = ["-y", "@magicuidesign/mcp@2.0.0"]
enabled = false
startup_timeout_sec = 60
tool_timeout_sec = 180
default_tools_approval_mode = "prompt"

[mcp_servers.shadcn]
command = "/bin/zsh"
args = ["-lc", "cd web && exec npx -y shadcn@4.11.0 mcp"]
enabled = false
startup_timeout_sec = 60
tool_timeout_sec = 180
default_tools_approval_mode = "prompt"

[mcp_servers.typeui]
url = "https://mcp.typeui.sh"
enabled = false
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "prompt"

[mcp_servers.untitledui]
url = "https://www.untitledui.com/react/api/mcp"
enabled = false
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "prompt"
