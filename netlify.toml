# The pre-launch article placeholders were removed on 2026-07-07. Old article
# URLs (clean or .html) 301 to the blog hub; this rule is NOT forced, so any
# future prerendered article file at /blog/<slug> is served ahead of it.
[[redirects]]
  from = "/blog/*"
  to = "/blog"
  status = 301

# SPA fallback: prerendered files are served directly (non-forced redirects
# only apply when no file matches); anything else — client-only routes,
# unknown URLs — falls through to the React Router SPA shell. Must stay the
# LAST redirect in this file.
[[redirects]]
  from = "/*"
  to = "/__spa-fallback.html"
  status = 200

# Deploy previews live on *.netlify.app URLs; Netlify serves them with its
# automatic X-Robots-Tag: noindex, so no extra configuration is needed here.

# Serverless functions (contact-form email via Resend). RESEND_API_KEY,
# CONTACT_TO and CONTACT_FROM come from the Netlify site environment.
[functions]
  directory = "netlify/functions"
