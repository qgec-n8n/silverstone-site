# Basic headers for preview environment
[context.deploy-preview]
  # Apply noindex headers only to deploy preview builds so that crawlers
  # do not index temporary preview URLs. Production builds will not have
  # this header and will be indexable.

[[context.production.plugins]]
  package = "/plugins/netlify-plugin-indexnow"

