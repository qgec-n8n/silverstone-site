# Production deploy of the React/Vite application in /web. The build emits
# prerendered HTML for every route plus a SPA fallback, then writes
# sitemap.xml and robots.txt into the publish directory
# (web/scripts/generate-seo-artifacts.mjs).
[build]
  command = "npm --prefix web ci && npm --prefix web run build:production"
  publish = "web/build/client"

[build.environment]
  NODE_VERSION = "22"

# React Router emits canonical route documents as <path>/index.html. Disable
# Netlify's Pretty URLs post-processing so requests for the approved slashless
# paths are served directly instead of being redirected to trailing slashes.
[build.processing.html]
  pretty_urls = false

# The only redirect: collapse the assigned www hostname to the canonical host.
# Netlify forwards the unmatched query string automatically for 301 rules.
[[redirects]]
  from = "https://www.silverstone-ai.com/*"
  to = "https://silverstone-ai.com/:splat"
  status = 301
  force = true

# Deploy previews live on *.netlify.app URLs; Netlify serves them with its
# automatic X-Robots-Tag: noindex, so no extra configuration is needed here.

# The Web Design & Development page embeds the two live demo websites in
# iframes (web/src/features/services-v2/demos/browser-showcase.tsx). This
# frame-src allow-list is scoped to that route and holds exactly the two demo
# origins. Nested integrations inside the demos (e.g. the Aesthetics by Clouds
# booking portal and Calendly's own Stripe frames) are governed by those
# embedded documents, not this policy. Both demo sites answer with
# frame-ancestors allowing https://silverstone-ai.com and
# https://www.silverstone-ai.com, so the windows only come alive on the
# production domain (deploy previews on *.netlify.app fall back to the
# posters and open-in-new-tab links).
[[headers]]
  for = "/services/web-design-development"
  [headers.values]
    Content-Security-Policy = "frame-src https://ownly-housing.netlify.app https://aestheticsbyclouds.netlify.app"

# The Skin & Aesthetic Clinics industry page embeds the same showcase component
# restricted to a single build — the Aesthetics by Clouds clinic site — as
# sector proof directly under its hero. Only that one origin is allowed here;
# Ownly Housing is not shown on this route and must not be frameable from it.
[[headers]]
  for = "/industry/aesthetic-clinics"
  [headers.values]
    Content-Security-Policy = "frame-src https://aestheticsbyclouds.netlify.app"

# Conservative site-wide security headers (additive; none affect rendering).
# X-Frame-Options and Permissions-Policy are intentionally omitted pending a
# review of the live demo iframes.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The Atom 1.0 article feed (web/scripts/generate-seo-artifacts.mjs). Netlify
# would otherwise serve it as generic XML; feed readers and crawlers should see
# the real media type. Short max-age because the publishing automation adds an
# article most days and the feed exists to be re-polled cheaply.
[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/atom+xml; charset=utf-8"
    Cache-Control = "public, max-age=600"

# Client documents served for direct sharing (e.g. invoices) must never be
# indexed by search engines. Header-only change; the files stay reachable
# for anyone holding the link.
[[headers]]
  for = "/invoices/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Serverless functions: contact email uses Resend; native booking reads the
# server-only CALENDLY_API_TOKEN and optional CALENDLY_EVENT_TYPE_URI from the
# Netlify site environment. None are exposed to the Vite client.
[functions]
  directory = "netlify/functions"
