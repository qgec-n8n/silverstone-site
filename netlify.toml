# The pre-launch article placeholders were removed on 2026-07-07. Old article
# URLs (clean or .html) 301 to the blog hub; this rule is NOT forced, so any
# future prerendered article file at /blog/<slug> is served ahead of it.
[[redirects]]
  from = "/blog/*"
  to = "/blog"
  status = 301

# SPA fallback: prerendered files are served directly (non-forced redirects
# only apply when no file matches); anything else — client-only routes,
# unknown URLs — falls through to the React Router SPA shell. Must stay the
# LAST redirect in this file.
[[redirects]]
  from = "/*"
  to = "/__spa-fallback.html"
  status = 200

# Deploy previews live on *.netlify.app URLs; Netlify serves them with its
# automatic X-Robots-Tag: noindex, so no extra configuration is needed here.

# The Web Design & Development page embeds the two live demo websites in
# iframes (web/src/features/services-v2/demos/browser-showcase.tsx). This
# frame-src allow-list is scoped to that route only and holds exactly the two
# demo origins plus https://calendly.com — the site-wide CalendlyWarmup
# (web/src/features/core-pages/calendly.tsx) mounts a hidden scheduler iframe
# on every route, so omitting it here would break the booking warm-up on this
# page. Nested integrations inside the demos (e.g. the Aesthetics by Clouds
# booking portal and Calendly's own Stripe frames) are governed by those
# embedded documents, not this policy. Both demo sites answer with
# frame-ancestors allowing https://silverstone-ai.com and
# https://www.silverstone-ai.com, so the windows only come alive on the
# production domain (deploy previews on *.netlify.app fall back to the
# posters and open-in-new-tab links).
[[headers]]
  for = "/services/web-design-development"
  [headers.values]
    Content-Security-Policy = "frame-src https://ownly-housing.netlify.app https://aestheticsbyclouds.netlify.app https://calendly.com"

[[headers]]
  for = "/services/web-design-development/"
  [headers.values]
    Content-Security-Policy = "frame-src https://ownly-housing.netlify.app https://aestheticsbyclouds.netlify.app https://calendly.com"

# Serverless functions (contact-form email via Resend). RESEND_API_KEY,
# CONTACT_TO and CONTACT_FROM come from the Netlify site environment.
[functions]
  directory = "netlify/functions"
